name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        type: string
      verify_only:
        description: 'Build and validate all release artifacts without creating or syncing a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  LIBHEIF_VERSION: 1.23.1
  WHISPER_CPP_VERSION: 1.9.1
  FFMPEG_VERSION: 8.1.2
  FFMPEG_BUILD_REVISION: n8.1.2-34-g9b6c8969e0
  FFMPEG_RELEASE_TAG: autobuild-2026-08-09-13-03
  FFMPEG_SOURCE_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
  FFMPEG_WIN64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-09-13-03/ffmpeg-n8.1.2-34-g9b6c8969e0-win64-gpl-8.1.zip
  FFMPEG_WIN64_SHA256: dee1b458ad8fa8556d0cc7287a1ec66664d0c2d6a1098d19cf0c465d9d8430bf
  FFMPEG_WINARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-09-13-03/ffmpeg-n8.1.2-34-g9b6c8969e0-winarm64-gpl-8.1.zip
  FFMPEG_WINARM64_SHA256: ab350d5e1f77468c98dfe237064efba4004a7b059669fefd206c4a54dd23b211
  FFMPEG_LINUX64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-09-13-03/ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-gpl-8.1.tar.xz
  FFMPEG_LINUX64_SHA256: c7f279081aa3dd837ba23c05e4d02f5f3874c428d2f134e1bbbea9726f8d2e7e
  FFMPEG_LINUXARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-09-13-03/ffmpeg-n8.1.2-34-g9b6c8969e0-linuxarm64-gpl-8.1.tar.xz
  FFMPEG_LINUXARM64_SHA256: bde27b02e0067a45e1d942d8b455f6668bb6ac08e2da680a1a8d7c8465a38cc0
  NATIVE_RUNTIME_CACHE_VERSION: v1

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron download cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-macos-arm64-${{ hashFiles('package-lock.json') }}

      - name: Restore macOS native runtime cache
        id: restore-native-runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/heif
            resources/whisper.cpp
          key: native-runtime-macos-arm64-${{ env.NATIVE_RUNTIME_CACHE_VERSION }}-${{ env.FFMPEG_BUILD_REVISION }}-${{ env.LIBHEIF_VERSION }}-${{ env.WHISPER_CPP_VERSION }}-${{ hashFiles('scripts/build-heif-source.ts', 'scripts/prepare-heif-runtime.ts', 'scripts/build-whisper-macos.ts', 'scripts/prepare-asr-runtime.ts', 'scripts/macos-runtime-dependencies.ts', 'scripts/check-bundled-asr-runtime.ts', 'scripts/check-heif-runtime.ts', 'src/core/ai/whisper-binary.ts') }}

      - run: npm ci

      - name: Check license manifest
        run: npm run check:licenses

      - name: Stage vision model
        run: npm run release:prepare-vision-model -- --resource-dir "$GITHUB_WORKSPACE/resources"

      - name: Install HEIF and media runtime dependencies
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          # libheif only uses these three codec libraries on macOS. FFmpeg is
          # built from its pinned source archive below, so installing its full
          # Homebrew dependency graph only adds minutes and can break on an
          # unrelated source formula such as x265.
          brew install cmake ninja pkg-config libde265 kvazaar jpeg-turbo

      - name: Build fixed FFmpeg runtime
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          source_dir="$RUNNER_TEMP/ffmpeg-${FFMPEG_VERSION}"
          install_dir="$RUNNER_TEMP/ffmpeg-install"
          curl --fail --location --retry 5 --retry-all-errors --output "$archive" "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "${FFMPEG_SOURCE_SHA256}  ${archive}" | shasum -a 256 -c -
          rm -rf "$source_dir" "$install_dir"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$install_dir"
          pushd "$source_dir"
          ./configure \
            --prefix="$install_dir" \
            --bindir="$install_dir/bin" \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-autodetect \
            --enable-gpl \
            --enable-version3 \
            --enable-static \
            --disable-shared
          make -j"$(sysctl -n hw.ncpu)"
          make install
          popd
          for binary in "$install_dir/bin/ffmpeg" "$install_dir/bin/ffprobe"; do
            if [[ ! -f "$binary" ]]; then
              echo "FFmpeg binary was not installed: $binary"
              find "$install_dir" -maxdepth 3 -type f -print
              exit 1
            fi
            chmod +x "$binary"
          done
          echo "AIVPLAYER_STAGE_FFMPEG_BIN=$install_dir/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: Build static HEIF runtime
        env:
          AIVPLAYER_HEIF_ENCODER: kvazaar
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          npm run release:build-heif-source -- \
            --source-dir "$RUNNER_TEMP/libheif" \
            --build-dir "$RUNNER_TEMP/libheif-build" \
            --install-dir "$RUNNER_TEMP/libheif-install" \
            --resource-dir "$GITHUB_WORKSPACE/resources" \
            --encoder kvazaar
          npm run release:check-heif-runtime

      - name: Build and stage ASR/media runtime
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          npm run release:build-whisper-macos -- --tag "v${WHISPER_CPP_VERSION}"
          npm run release:check-runtime

      - name: Verify cached macOS native runtimes
        if: steps.restore-native-runtime-cache.outputs.cache-hit == 'true'
        run: npm run release:check-runtime && npm run release:check-heif-runtime

      - name: Verify macOS FFmpeg Mach-O runtime
        run: npm run release:check-macos-ffmpeg -- --resource-dir "$GITHUB_WORKSPACE/resources/ffmpeg" --max-minos 12.0

      - name: Write runtime metadata
        run: npm run release:write-runtime-metadata -- --platform darwin --resource-dir "$GITHUB_WORKSPACE/resources" --whisper-version "$WHISPER_CPP_VERSION" --libheif-version "$LIBHEIF_VERSION" --libheif-encoder kvazaar

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
        run: |
          resource_dir="$(find release -type d -path '*/AIVPlayer.app/Contents/Resources' -print -quit)"
          test -n "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Verify macOS release artifacts
        run: npm run release:check-platform -- --platform macos --artifacts-dir release --report-path release/platform-release-report-macos.json

      - name: Verify macOS package formats
        run: npm run release:check-formats -- --platform macos --artifacts-dir release

      - name: Upload macOS release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-macos
          path: release/platform-release-report-macos.json
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      VCPKG_BINARY_SOURCES: 'clear;files,C:/vcpkg/binary-cache,readwrite'
      VCPKG_FEATURE_FLAGS: binarycaching
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron download cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-windows-x64-${{ hashFiles('package-lock.json') }}

      - name: Restore Windows x64 native runtime cache
        id: restore-native-runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/heif
            resources/whisper.cpp
          key: native-runtime-windows-x64-${{ env.NATIVE_RUNTIME_CACHE_VERSION }}-${{ env.FFMPEG_BUILD_REVISION }}-${{ env.LIBHEIF_VERSION }}-${{ env.WHISPER_CPP_VERSION }}-${{ hashFiles('scripts/build-heif-source.ts', 'scripts/prepare-heif-runtime.ts', 'scripts/prepare-runtime.ts', 'scripts/prepare-asr-runtime.ts', 'scripts/check-bundled-asr-runtime.ts', 'scripts/check-heif-runtime.ts', 'src/core/ai/whisper-binary.ts') }}

      - name: Restore vcpkg binary cache
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/binary-cache
          key: vcpkg-windows-x64-v1-${{ env.LIBHEIF_VERSION }}
          restore-keys: |
            vcpkg-windows-x64-v1-

      - run: npm ci

      - name: Check license manifest
        run: npm run check:licenses

      - name: Stage vision model
        shell: pwsh
        run: npm run release:prepare-vision-model -- --resource-dir "$env:GITHUB_WORKSPACE/resources"

      - name: Install HEIF build dependencies
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64.zip'
          $ffmpegRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64'
          function Download-WithRetry {
            param([string]$Uri, [string]$OutputPath)
            $partialPath = "$OutputPath.part"
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Remove-Item -Force -ErrorAction SilentlyContinue $partialPath
              & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 --output $partialPath $Uri
              if ($LASTEXITCODE -eq 0 -and (Test-Path $partialPath)) {
                Move-Item -Force $partialPath $OutputPath
                return
              }
              if ($attempt -lt 5) { Start-Sleep -Seconds ([int][math]::Pow(2, $attempt)) }
            }
            throw "Failed to download $Uri after 5 attempts."
          }
          Download-WithRetry -Uri $env:FFMPEG_WIN64_URL -OutputPath $ffmpegArchive
          if ((Get-FileHash -Path $ffmpegArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:FFMPEG_WIN64_SHA256) { throw 'The downloaded Windows x64 FFmpeg checksum does not match.' }
          Remove-Item -Recurse -Force $ffmpegRoot -ErrorAction SilentlyContinue
          Expand-Archive -Path $ffmpegArchive -DestinationPath $ffmpegRoot -Force
          vcpkg install libde265:x64-windows-static x265:x64-windows-static libjpeg-turbo:x64-windows-static tiff:x64-windows-static

      - name: Build static HEIF runtime
        env:
          AIVPLAYER_HEIF_ENCODER: x265
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $source = Join-Path $env:RUNNER_TEMP "libheif"
          $build = Join-Path $env:RUNNER_TEMP "libheif-build"
          $install = Join-Path $env:RUNNER_TEMP "libheif-install"
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $x265Library = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static\lib\x265-static.lib"
          if (!(Test-Path $x265Library)) { throw "vcpkg x265 static library was not found: $x265Library" }
          git clone --depth 1 --branch "v$env:LIBHEIF_VERSION" https://github.com/strukturag/libheif.git $source
          npm run release:build-heif-source -- --source-dir $source --build-dir $build --install-dir $install --resource-dir "$env:GITHUB_WORKSPACE/resources" --platform win32 --toolchain-file $toolchain --vcpkg-triplet x64-windows-static --encoder x265 --x265-library $x265Library
          npm run release:check-heif-runtime

      - name: Build and stage ASR/media runtime
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $source = Join-Path $env:RUNNER_TEMP "whisper.cpp"
          $build = Join-Path $env:RUNNER_TEMP "whisper-build"
          git clone --depth 1 --branch "v$env:WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git $source
          cmake -S $source -B $build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build $build --config Release --parallel
          $whisperBinary = Get-ChildItem -Path $build -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if ($null -eq $whisperBinary) { throw "whisper-cli.exe was not built." }
          $ffmpegRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64'
          $ffmpegBinary = Get-ChildItem -Path $ffmpegRoot -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpegBinary) { throw "The actual ffmpeg.exe was not found under $ffmpegRoot" }
          $ffprobeBinary = Join-Path $ffmpegBinary.DirectoryName 'ffprobe.exe'
          if (!(Test-Path $ffprobeBinary)) { throw "The matching ffprobe.exe was not found beside $($ffmpegBinary.FullName)" }
          $ffmpegDir = $ffmpegBinary.DirectoryName
          npm run release:prepare-runtime -- --platform win32 --whisper-bin $whisperBinary.FullName --ffmpeg-dir $ffmpegDir
          npm run release:check-runtime

      - name: Verify cached Windows x64 native runtimes
        if: steps.restore-native-runtime-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run release:check-runtime
          npm run release:check-heif-runtime

      - name: Verify Windows x64 native binaries
        shell: pwsh
        run: |
          npm run release:check-architecture -- --architecture x64 --file "$env:GITHUB_WORKSPACE/resources/whisper.cpp/whisper-cli.exe" --file "$env:GITHUB_WORKSPACE/resources/ffmpeg/ffmpeg.exe" --file "$env:GITHUB_WORKSPACE/resources/ffmpeg/ffprobe.exe" --file "$env:GITHUB_WORKSPACE/resources/heif/heif-enc.exe" --file "$env:GITHUB_WORKSPACE/resources/heif/heif-convert.exe"

      - name: Write runtime metadata
        shell: pwsh
        run: npm run release:write-runtime-metadata -- --platform win32 --resource-dir "$env:GITHUB_WORKSPACE/resources" --whisper-version "$env:WHISPER_CPP_VERSION" --libheif-version "$env:LIBHEIF_VERSION" --libheif-encoder x265

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Generate Microsoft Store MSIX config
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_APPLICATION_ID: ${{ vars.MSIX_APPLICATION_ID }}
        run: npm run msix:generate-config

      - name: Build Microsoft Store MSIX x64
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        run: |
          npx electron-builder --config electron-builder-msix.generated.json --win --x64 --publish never
          $package = Get-ChildItem -Path release-msix -Filter '*.appx' -File | Select-Object -First 1
          if ($null -eq $package) { throw 'Windows x64 MSIX package was not generated.' }

      - name: Verify packaged Web and FFmpeg resources
        shell: pwsh
        run: |
          $resourceDir = Get-ChildItem -Path release -Directory -Recurse -Filter resources | Select-Object -First 1
          if ($null -eq $resourceDir) { throw 'Packaged resources directory was not found.' }
          npm run release:check-packaged-resources -- --resource-dir $resourceDir.FullName

      - name: Verify packaged Windows x64 executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path release -File -Recurse -Filter 'AIVPlayer.exe' | Select-Object -First 1
          if ($null -eq $executable) { throw 'Packaged Windows x64 executable was not found.' }
          npm run release:check-architecture -- --architecture x64 --file $executable.FullName

      - name: Verify Windows release artifacts
        run: npm run release:check-platform -- --platform windows --architecture x64 --artifacts-dir release --report-path release/platform-release-report-windows.json

      - name: Verify Windows package formats
        run: npm run release:check-formats -- --platform windows --artifacts-dir release

      - name: Upload Windows release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-windows
          path: release/platform-release-report-windows.json
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Upload Windows x64 MSIX
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix-x64
          path: release-msix/*.appx
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      VCPKG_BINARY_SOURCES: 'clear;files,C:/vcpkg/binary-cache,readwrite'
      VCPKG_FEATURE_FLAGS: binarycaching
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron download cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-windows-arm64-${{ hashFiles('package-lock.json') }}

      - name: Restore Windows ARM64 native runtime cache
        id: restore-native-runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/heif
            resources/whisper.cpp
          key: native-runtime-windows-arm64-${{ env.NATIVE_RUNTIME_CACHE_VERSION }}-${{ env.FFMPEG_BUILD_REVISION }}-${{ env.LIBHEIF_VERSION }}-${{ env.WHISPER_CPP_VERSION }}-${{ hashFiles('scripts/build-heif-source.ts', 'scripts/prepare-heif-runtime.ts', 'scripts/prepare-runtime.ts', 'scripts/prepare-asr-runtime.ts', 'scripts/check-bundled-asr-runtime.ts', 'scripts/check-heif-runtime.ts', 'src/core/ai/whisper-binary.ts') }}

      - name: Restore vcpkg binary cache
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/binary-cache
          key: vcpkg-windows-arm64-v1-${{ env.LIBHEIF_VERSION }}
          restore-keys: |
            vcpkg-windows-arm64-v1-

      - run: npm ci

      - name: Check license manifest
        run: npm run check:licenses

      - name: Stage vision model
        shell: pwsh
        run: npm run release:prepare-vision-model -- --resource-dir "$env:GITHUB_WORKSPACE/resources"

      - name: Install HEIF build dependencies
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $ffmpegUrl = $env:FFMPEG_WINARM64_URL
          $ffmpegSha256 = $env:FFMPEG_WINARM64_SHA256
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64.zip'
          $ffmpegRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64'
          function Download-WithRetry {
            param([string]$Uri, [string]$OutputPath)
            $partialPath = "$OutputPath.part"
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Remove-Item -Force -ErrorAction SilentlyContinue $partialPath
              & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 --output $partialPath $Uri
              if ($LASTEXITCODE -eq 0 -and (Test-Path $partialPath)) {
                Move-Item -Force $partialPath $OutputPath
                return
              }
              if ($attempt -lt 5) { Start-Sleep -Seconds ([int][math]::Pow(2, $attempt)) }
            }
            throw "Failed to download $Uri after 5 attempts."
          }
          Download-WithRetry -Uri $ffmpegUrl -OutputPath $ffmpegArchive
          if ((Get-FileHash -Path $ffmpegArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $ffmpegSha256) { throw 'The downloaded Windows ARM64 FFmpeg checksum does not match.' }
          Expand-Archive -Path $ffmpegArchive -DestinationPath $ffmpegRoot -Force
          vcpkg install libde265:arm64-windows-static x265:arm64-windows-static libjpeg-turbo:arm64-windows-static tiff:arm64-windows-static

      - name: Build static HEIF runtime
        env:
          AIVPLAYER_HEIF_ENCODER: x265
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $source = Join-Path $env:RUNNER_TEMP "libheif"
          $build = Join-Path $env:RUNNER_TEMP "libheif-build"
          $install = Join-Path $env:RUNNER_TEMP "libheif-install"
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $x265Library = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\arm64-windows-static\lib\x265-static.lib"
          if (!(Test-Path $x265Library)) { throw "vcpkg x265 static library was not found: $x265Library" }
          git clone --depth 1 --branch "v$env:LIBHEIF_VERSION" https://github.com/strukturag/libheif.git $source
          npm run release:build-heif-source -- --source-dir $source --build-dir $build --install-dir $install --resource-dir "$env:GITHUB_WORKSPACE/resources" --platform win32 --toolchain-file $toolchain --vcpkg-triplet arm64-windows-static --encoder x265 --x265-library $x265Library
          npm run release:check-heif-runtime

      - name: Build and stage ARM64 ASR/media runtime
        shell: pwsh
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          $source = Join-Path $env:RUNNER_TEMP "whisper.cpp"
          $build = Join-Path $env:RUNNER_TEMP "whisper-build"
          $toolchain = Join-Path $source "cmake\arm64-windows-llvm.cmake"
          git clone --depth 1 --branch "v$env:WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git $source
          clang --version
          ninja --version
          $ninja = (Get-Command ninja -CommandType Application).Path
          cmake -S $source -B $build -G Ninja "-DCMAKE_MAKE_PROGRAM=$ninja" "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build $build --config Release --parallel
          $whisperBinary = Get-ChildItem -Path $build -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if ($null -eq $whisperBinary) { throw "whisper-cli.exe was not built." }
          $ffmpegRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-winarm64'
          $ffmpegBinary = Get-ChildItem -Path $ffmpegRoot -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpegBinary) { throw "The actual ffmpeg.exe was not found under $ffmpegRoot" }
          $ffprobeBinary = Join-Path $ffmpegBinary.DirectoryName 'ffprobe.exe'
          if (!(Test-Path $ffprobeBinary)) { throw "The matching ffprobe.exe was not found beside $($ffmpegBinary.FullName)" }
          npm run release:prepare-runtime -- --platform win32 --whisper-bin $whisperBinary.FullName --ffmpeg-dir $ffmpegBinary.DirectoryName
          npm run release:check-runtime

      - name: Verify cached Windows ARM64 native runtimes
        if: steps.restore-native-runtime-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run release:check-runtime
          npm run release:check-heif-runtime

      - name: Verify Windows ARM64 native binaries
        shell: pwsh
        run: |
          npm run release:check-architecture -- --architecture arm64 --file "$env:GITHUB_WORKSPACE/resources/whisper.cpp/whisper-cli.exe" --file "$env:GITHUB_WORKSPACE/resources/ffmpeg/ffmpeg.exe" --file "$env:GITHUB_WORKSPACE/resources/ffmpeg/ffprobe.exe" --file "$env:GITHUB_WORKSPACE/resources/heif/heif-enc.exe" --file "$env:GITHUB_WORKSPACE/resources/heif/heif-convert.exe"

      - name: Write runtime metadata
        shell: pwsh
        run: npm run release:write-runtime-metadata -- --platform win32 --resource-dir "$env:GITHUB_WORKSPACE/resources" --whisper-version "$env:WHISPER_CPP_VERSION" --libheif-version "$env:LIBHEIF_VERSION" --libheif-encoder x265

      - name: Build & Package ARM64
        run: npm run build && npx electron-builder --win --arm64 --publish never

      - name: Generate Microsoft Store MSIX config
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_APPLICATION_ID: ${{ vars.MSIX_APPLICATION_ID }}
        run: npm run msix:generate-config

      - name: Build Microsoft Store MSIX ARM64
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        run: |
          npx electron-builder --config electron-builder-msix.generated.json --win --arm64 --publish never
          $package = Get-ChildItem -Path release-msix -Filter '*.appx' -File | Select-Object -First 1
          if ($null -eq $package) { throw 'Windows ARM64 MSIX package was not generated.' }

      - name: Verify packaged Web and FFmpeg resources
        shell: pwsh
        run: |
          $resourceDir = Get-ChildItem -Path release -Directory -Recurse -Filter resources | Select-Object -First 1
          if ($null -eq $resourceDir) { throw 'Packaged resources directory was not found.' }
          npm run release:check-packaged-resources -- --resource-dir $resourceDir.FullName

      - name: Verify packaged Windows ARM64 executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path release -File -Recurse -Filter 'AIVPlayer.exe' | Select-Object -First 1
          if ($null -eq $executable) { throw 'Packaged Windows ARM64 executable was not found.' }
          npm run release:check-architecture -- --architecture arm64 --file $executable.FullName

      - name: Verify Windows ARM64 release artifacts
        run: npm run release:check-platform -- --platform windows --architecture arm64 --artifacts-dir release --report-path release/platform-release-report-windows-arm64.json

      - name: Verify Windows ARM64 package formats
        run: npm run release:check-formats -- --platform windows --artifacts-dir release

      - name: Upload Windows ARM64 release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-windows-arm64
          path: release/platform-release-report-windows-arm64.json
          if-no-files-found: ignore

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: |
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Upload Windows ARM64 MSIX
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix-arm64
          path: release-msix/*.appx
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron download cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-linux-x64-${{ hashFiles('package-lock.json') }}

      - name: Restore Linux x64 native runtime cache
        id: restore-native-runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/ffmpeg
            resources/heif
            resources/whisper.cpp
          key: native-runtime-linux-x64-${{ env.NATIVE_RUNTIME_CACHE_VERSION }}-${{ env.FFMPEG_BUILD_REVISION }}-${{ env.LIBHEIF_VERSION }}-${{ env.WHISPER_CPP_VERSION }}-${{ hashFiles('scripts/build-heif-source.ts', 'scripts/prepare-heif-runtime.ts', 'scripts/prepare-runtime.ts', 'scripts/prepare-asr-runtime.ts', 'scripts/check-bundled-asr-runtime.ts', 'scripts/check-heif-runtime.ts', 'src/core/ai/whisper-binary.ts') }}

      - run: npm ci

      - name: Check license manifest
        run: npm run check:licenses

      - name: Stage vision model
        run: npm run release:prepare-vision-model -- --resource-dir "$GITHUB_WORKSPACE/resources"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 cmake ninja-build pkg-config libde265-dev libx265-dev libjpeg-dev zlib1g-dev

      - name: Install fixed FFmpeg runtime
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/ffmpeg-linux64.tar.xz"
          partial="$archive.part"
          root="$RUNNER_TEMP/ffmpeg-linux64"
          rm -f "$partial"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 --output "$partial" "$FFMPEG_LINUX64_URL"
          mv "$partial" "$archive"
          echo "${FFMPEG_LINUX64_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$root"
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root"
          ffmpeg_dir="$(find "$root" -type d -name bin -print -quit)"
          test -n "$ffmpeg_dir"
          test -x "$ffmpeg_dir/ffmpeg"
          test -x "$ffmpeg_dir/ffprobe"
          echo "AIVPLAYER_FFMPEG_DIR=$ffmpeg_dir" >> "$GITHUB_ENV"

      - name: Build static HEIF runtime
        env:
          AIVPLAYER_HEIF_ENCODER: x265
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          CXXFLAGS=-fpermissive npm run release:build-heif-source -- \
            --source-dir "$RUNNER_TEMP/libheif" \
            --build-dir "$RUNNER_TEMP/libheif-build" \
            --install-dir "$RUNNER_TEMP/libheif-install" \
            --resource-dir "$GITHUB_WORKSPACE/resources" \
            --platform linux \
            --encoder x265
          npm run release:check-heif-runtime

      - name: Build and stage ASR/media runtime
        shell: bash
        if: steps.restore-native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          source_dir="$RUNNER_TEMP/whisper.cpp"
          build_dir="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "v${WHISPER_CPP_VERSION}" https://github.com/ggml-org/whisper.cpp.git "$source_dir"
          cmake -S "$source_dir" -B "$build_dir" -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" --parallel
          npm run release:prepare-runtime -- --platform linux --whisper-dir "$build_dir/bin" --ffmpeg-dir "$AIVPLAYER_FFMPEG_DIR"
          npm run release:check-runtime

      - name: Verify cached Linux x64 native runtimes
        if: steps.restore-native-runtime-cache.outputs.cache-hit == 'true'
        run: npm run release:check-runtime && npm run release:check-heif-runtime

      - name: Verify Linux x64 native binaries
        run: npm run release:check-architecture -- --architecture x64 --file "$GITHUB_WORKSPACE/resources/whisper.cpp/whisper-cli" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffmpeg" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffprobe" --file "$GITHUB_WORKSPACE/resources/heif/heif-enc" --file "$GITHUB_WORKSPACE/resources/heif/heif-convert"

      - name: Write runtime metadata
        run: npm run release:write-runtime-metadata -- --platform linux --resource-dir "$GITHUB_WORKSPACE/resources" --whisper-version "$WHISPER_CPP_VERSION" --libheif-version "$LIBHEIF_VERSION" --libheif-encoder x265

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
        run: |
          resource_dir="release/linux-unpacked/resources"
          test -d "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Verify packaged Linux x64 executable
        shell: bash
        run: |
          executable="$(find release -type f -iname 'aivplayer' -print -quit)"
          test -n "$executable"
          npm run release:check-architecture -- --architecture x64 --file "$executable"

      - name: Smoke test Debian install hooks
        shell: bash
        run: |
          set -euo pipefail
          deb_file="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_file"
          deb_file="$(realpath "$deb_file")"
          test "$(dpkg-deb -f "$deb_file" Package)" = 'aivplayer'
          cleanup() {
            sudo apt-get remove -y aivplayer >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo apt-get install -y "$deb_file"
          sandbox="/opt/AIVPlayer/chrome-sandbox"
          test -f "$sandbox"
          test "$(stat -c '%U:%G %a' "$sandbox")" = 'root:root 4755'
          test "$(readlink -f /usr/bin/aivcli)" = '/opt/AIVPlayer/aivcli'
          sudo apt-get remove -y aivplayer
          test ! -e /usr/bin/aivcli

      - name: Verify Linux release artifacts
        run: npm run release:check-platform -- --platform linux --architecture x64 --artifacts-dir release --report-path release/platform-release-report-linux.json

      - name: Verify Linux package formats
        run: npm run release:check-formats -- --platform linux --artifacts-dir release

      - name: Upload Linux release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux
          path: release/platform-release-report-linux.json
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

