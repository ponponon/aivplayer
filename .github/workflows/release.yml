  publish-release:
    needs: [build-macos, build-windows, build-windows-arm64, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble architecture-aware release artifacts
        run: npm run release:assemble-artifacts -- --input-dir artifacts --output-dir artifacts/assembled

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Verify assembled package formats
        run: |
          npm run release:check-formats -- --platform macos --artifacts-dir artifacts/assembled
          npm run release:check-formats -- --platform windows --artifacts-dir artifacts/assembled
          npm run release:check-formats -- --platform linux --artifacts-dir artifacts/assembled

      - name: Verify merged platform evidence
        run: npm run release:check-evidence -- --artifacts-dir artifacts/assembled --report-path artifacts/assembled/merged-platform-evidence.json

      - name: Upload merged platform evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-merged
          path: artifacts/assembled/merged-platform-evidence.json
          if-no-files-found: ignore

      - name: Verify release version and update metadata
        run: npm run release:check-version -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}"

      - name: Generate release manifest
        run: npm run release:create-manifest -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}" --commit "${{ github.sha }}" --repository "${{ github.repository }}" --workflow "${{ github.workflow }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}"

      - name: Verify release manifest
        run: npm run release:check-manifest -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}"

      - name: Upload Windows installers to MinIO
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_ADDRESSING_STYLE: path
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_PUBLIC_BASE_URL: ${{ secrets.MINIO_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$MINIO_ENDPOINT" || -z "$MINIO_BUCKET" || -z "$MINIO_PUBLIC_BASE_URL" ]]; then
            echo 'MinIO secrets are not configured; skipping MinIO upload.'
            exit 0
          fi

          aws configure set default.s3.addressing_style path
          version="${RELEASE_TAG#v}"
          for architecture in x64 arm64; do
            file="artifacts/assembled/AIVPlayer-Setup-${version}-${architecture}.exe"
            if [[ ! -f "$file" ]]; then
              echo "Windows ${architecture} installer is missing: $file" >&2
              exit 1
            fi

            file_name="$(basename "$file")"
            object_key="aivplayer/${RELEASE_TAG}/${file_name}"
            aws s3 cp "$file" "s3://${MINIO_BUCKET}/${object_key}" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --content-type application/octet-stream \
              --content-disposition "attachment; filename=\"${file_name}\"" \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress

            url="${MINIO_PUBLIC_BASE_URL%/}/${object_key}"
            http_code="$(curl --head --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 0 "$url")"
            if [[ "$http_code" != '200' ]]; then
              echo "MinIO package URL did not return HTTP 200: $url ($http_code)" >&2
              exit 1
            fi
            echo "MinIO package URL: $url"
          done

          {
            echo '### MinIO Windows 包地址'
            echo
            echo "- x64: ${MINIO_PUBLIC_BASE_URL%/}/aivplayer/${RELEASE_TAG}/AIVPlayer-Setup-${version}-x64.exe"
            echo "- arm64: ${MINIO_PUBLIC_BASE_URL%/}/aivplayer/${RELEASE_TAG}/AIVPlayer-Setup-${version}-arm64.exe"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Share release manifest with Gitee sync
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: artifacts/assembled/release-manifest.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/assembled/*.dmg
            artifacts/assembled/*.zip
            artifacts/assembled/*.pkg
            artifacts/assembled/*.exe
            artifacts/assembled/*.AppImage
            artifacts/assembled/*.deb
            artifacts/assembled/latest*.yml
            artifacts/assembled/*.blockmap
            artifacts/assembled/release-manifest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub remote assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:verify-remote -- --platform github --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" --artifacts-dir artifacts/assembled --manifest-path artifacts/assembled/release-manifest.json --tag "${{ inputs.tag || github.ref_name }}" --report-path artifacts/assembled/github-remote-verification.json

      - name: Share GitHub remote verification report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: remote-verification-github
          path: artifacts/assembled/github-remote-verification.json
          if-no-files-found: error

  sync-gitee-release:
    needs: [publish-release]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ponponon
      GITEE_REPO: aivplayer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GITEE_TARGET_COMMITISH: main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Skip Gitee sync when no token is configured
        if: ${{ env.GITEE_TOKEN == '' }}
        run: echo "GITEE_TOKEN is not configured; skipping Gitee release sync."

      - name: Download release artifacts
        if: ${{ env.GITEE_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble architecture-aware Gitee artifacts
        if: ${{ env.GITEE_TOKEN != '' }}
        run: npm run release:assemble-artifacts -- --input-dir artifacts --output-dir artifacts/assembled

      - name: Sync release to Gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          ARTIFACTS_DIR: artifacts/assembled
        run: node scripts/sync-gitee-release.mjs

      - name: Verify Gitee remote assets
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          RELEASE_TOKEN: ${{ env.GITEE_TOKEN }}
        run: npm run release:verify-remote -- --platform gitee --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --artifacts-dir artifacts/assembled --manifest-path artifacts/assembled/release-manifest.json --tag "$RELEASE_TAG" --report-path artifacts/assembled/gitee-remote-verification.json

      - name: Share Gitee remote verification report
        if: ${{ env.GITEE_TOKEN != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: remote-verification-gitee
          path: artifacts/assembled/gitee-remote-verification.json
          if-no-files-found: error
