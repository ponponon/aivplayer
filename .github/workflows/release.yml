          resource_dir="$(find release -type d -path '*/resources' -print -quit)"
          test -n "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Verify packaged Linux ARM64 executable
        shell: bash
        run: |
          executable="$(find release -type f -iname 'aivplayer' -print -quit)"
