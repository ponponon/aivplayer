name: aivplayer
version: '0.2.0'
summary: 本地 AI 字幕生成的跨平台桌面视频播放器
description: |
  AIVPlayer 是一款基于 Electron 的现代化桌面视频播放器，
  核心亮点是集成了 whisper.cpp 本地 ASR 引擎，可以在不联网的情况下
  为视频自动生成高质量字幕。

grade: stable
confinement: strict
base: core22

architectures:
  - build-on: [amd64]
    build-for: [amd64]

parts:
  hello:
    plugin: nil
    override-build: |
      echo "Hello from snapcraft" > $CRAFT_PART_INSTALL/hello.txt

apps:
  hello:
    command: cat hello.txt
