name: Flatpak

on:
  pull_request:
    paths:
      - 'flatpak/**'
      - 'scripts/check-flatpak.mjs'
      - 'scripts/prepare-flatpak-ci-manifest.mjs'
      - '.github/workflows/flatpak.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'flatpak/**'
      - 'scripts/check-flatpak.mjs'
      - 'scripts/prepare-flatpak-ci-manifest.mjs'
      - '.github/workflows/flatpak.yml'
      - 'package.json'
      - 'package-lock.json'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_arm64:
        description: '同时构建 Linux ARM64 Flatpak'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static-check:
    name: Flatpak static check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest and metadata
        run: npm run flatpak:check

  build-x86_64:
    name: Flatpak build (x86_64)
    runs-on: ubuntu-latest
    needs: static-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare local source manifest
        run: |
          rm -rf flatpak/ci-source
          mkdir -p flatpak/ci-source
          git archive --format=tar HEAD | tar -x -C flatpak/ci-source
          npm run flatpak:prepare-ci-manifest -- flatpak/cn.quniv.aivplayer.yml flatpak/ci-manifest.yml
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          arch=$(flatpak --default-arch)
          dbus-run-session -- flatpak install --user --assumeyes --noninteractive flathub \
            org.freedesktop.Platform/${arch}/25.08 \
            org.freedesktop.Sdk/${arch}/25.08 \
            org.freedesktop.Sdk.Extension.node22/${arch}/25.08 \
            org.electronjs.Electron2.BaseApp/${arch}/25.08
          dbus-run-session -- flatpak install --user --assumeyes --noninteractive flathub org.flatpak.Builder
      - name: Build Flatpak
        run: |
          dbus-run-session -- flatpak run --user \
            --command=flathub-build \
            org.flatpak.Builder flatpak/ci-manifest.yml
      - name: Lint manifest and repository
        run: |
          dbus-run-session -- flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/cn.quniv.aivplayer.yml
          dbus-run-session -- flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder repo repo
      - name: Create bundle
        run: flatpak build-bundle repo AIVPlayer-x86_64.flatpak cn.quniv.aivplayer
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: aivplayer-flatpak-x86_64
          path: AIVPlayer-x86_64.flatpak

  build-arm64:
    name: Flatpak build (aarch64)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_arm64 }}
    runs-on: ubuntu-24.04-arm
    needs: static-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare local source manifest
        run: |
          rm -rf flatpak/ci-source
          mkdir -p flatpak/ci-source
          git archive --format=tar HEAD | tar -x -C flatpak/ci-source
          npm run flatpak:prepare-ci-manifest -- flatpak/cn.quniv.aivplayer.yml flatpak/ci-manifest.yml
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          arch=$(flatpak --default-arch)
          dbus-run-session -- flatpak install --user --assumeyes --noninteractive flathub \
            org.freedesktop.Platform/${arch}/25.08 \
            org.freedesktop.Sdk/${arch}/25.08 \
            org.freedesktop.Sdk.Extension.node22/${arch}/25.08 \
            org.electronjs.Electron2.BaseApp/${arch}/25.08
          dbus-run-session -- flatpak install --user --assumeyes --noninteractive flathub org.flatpak.Builder
      - name: Build Flatpak
        run: |
          dbus-run-session -- flatpak run --user \
            --command=flathub-build \
            org.flatpak.Builder flatpak/ci-manifest.yml
      - name: Lint manifest and repository
        run: |
          dbus-run-session -- flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/cn.quniv.aivplayer.yml
          dbus-run-session -- flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder repo repo
      - name: Create bundle
        run: flatpak build-bundle repo AIVPlayer-aarch64.flatpak cn.quniv.aivplayer
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: aivplayer-flatpak-aarch64
          path: AIVPlayer-aarch64.flatpak

  upload-release-asset:
    name: Upload Flatpak bundle to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: aivplayer-flatpak-x86_64
      - name: Wait for release and upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release 工作流构建全平台约 1 小时后才创建 Release，这里轮询等待后追加 bundle
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" AIVPlayer-x86_64.flatpak --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            fi
            echo "Release $TAG 尚未创建（第 $i/90 次等待），60 秒后重试..."
            sleep 60
          done
          echo "等待 Release 超时" >&2
          exit 1
