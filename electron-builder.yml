appId: cn.quniv.aivplayer
productName: AIVPlayer
directories:
  output: release
publish:
  - provider: github
    owner: ponponon
    repo: aivplayer
    releaseType: release
extraFiles:
  - from: resources/cli/aivcli.cmd
    to: aivcli.cmd
  - from: resources/cli/aivcli
    to: aivcli
files:
  - out/**
  - package.json
  # LanceDB publishes optional embedding runtimes inside its own package. The
  # application uses the root HuggingFace runtime, so excluding these duplicate
  # copies keeps installers from carrying two incompatible ONNX stacks.
  - '!node_modules/@lancedb/lancedb/node_modules/@huggingface/**'
  - '!node_modules/@lancedb/lancedb/node_modules/@img/**'
  - '!node_modules/@lancedb/lancedb/node_modules/onnxruntime-*/**'
  - '!node_modules/@lancedb/lancedb/node_modules/sharp/**'
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: docs/THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
  - from: resources/runtime-metadata.json
    to: runtime-metadata.json
  - from: out/web
    to: web
    filter:
      - '**/*'
  - from: brand/icon.png
    to: app-icon.png
  - from: resources/whisper.cpp
    to: whisper.cpp
    filter:
      - '**/*'
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
  - from: resources/heif
    to: heif
    filter:
      - '**/*'
  - from: resources/vision/siglip2-base-patch16-224-ONNX
    to: vision/siglip2-base-patch16-224-ONNX
    filter:
      - config.json
      - preprocessor_config.json
      - quantize_config.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer.model
      - tokenizer_config.json
      - onnx/text_model_uint8.onnx
      - onnx/vision_model_uint8.onnx
