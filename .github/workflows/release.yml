name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  build-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (with retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if npm ci --prefer-offline --no-audit --fund=false; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed after $i attempts" >&2
              exit 1
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0

      - name: Build unpacked
        run: npm run build && npx electron-builder --dir --publish never

      - name: Install snapcraft and core22 (with retry)
        run: |
          set -euo pipefail

          retry_snap_command() {
            local attempts="$1"
            local initial_delay="$2"
            shift 2

            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if "$@"; then
                return 0
              fi
              if (( attempt == attempts )); then
                break
              fi
              local delay=$((initial_delay * 2 ** (attempt - 1)))
              echo "Attempt $attempt failed; retrying in ${delay}s..." >&2
              sleep "$delay"
            done

            return 1
          }

          retry_snap_command 5 10 sudo snap install core22 --channel=latest/stable
          retry_snap_command 5 10 sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if snapcraft pack --verbose --destructive-mode; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "snapcraft pack failed after $attempt attempts" >&2
              exit 1
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "Snap build attempt $attempt failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: '*.snap'
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows, build-linux, build-snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.pkg
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.snap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-snap:
    needs: [build-snap, publish-release]
    runs-on: ubuntu-latest
    if: ${{ needs.build-snap.result == 'success' && needs.publish-release.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap

      - name: Install snapcraft
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "snapcraft installation failed after $attempt attempts" >&2
              exit 1
            fi
            delay=$((10 * 2 ** (attempt - 1)))
            echo "Snapcraft installation attempt $attempt failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done

      - name: Login to Snapcraft
        run: echo "${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}" | snapcraft login --with -

      - name: Publish to Snap Store
        run: |
          set -euo pipefail
          shopt -s nullglob
          snaps=( *.snap )
          if [ "${#snaps[@]}" -ne 1 ]; then
            echo "Expected exactly one snap artifact, found ${#snaps[@]}" >&2
            exit 1
          fi

          snap="${snaps[0]}"
          for attempt in 1 2 3 4 5; do
            if snapcraft upload "$snap" --release=stable; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Snap Store upload failed after $attempt attempts" >&2
              exit 1
            fi
            delay=$((10 * 2 ** (attempt - 1)))
            echo "Snap Store upload attempt $attempt failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done
