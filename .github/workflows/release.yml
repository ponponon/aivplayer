        run: npm run release:check-architecture -- --architecture arm64 --file "$GITHUB_WORKSPACE/resources/whisper.cpp/whisper-cli" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffmpeg" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffprobe" --file "$GITHUB_WORKSPACE/resources/heif/heif-enc" --file "$GITHUB_WORKSPACE/resources/heif/heif-convert"

      - name: Write runtime metadata
        run: npm run release:write-runtime-metadata -- --platform linux --resource-dir "$GITHUB_WORKSPACE/resources" --whisper-version "$WHISPER_CPP_VERSION" --libheif-version "$LIBHEIF_VERSION" --libheif-encoder x265 --remote-vision-model

      - name: Build & Package ARM64
        run: npm run build && npx electron-builder --linux --arm64 --publish never

      - name: Report package size
        run: npm run release:report-package-size -- --directory release --output release/package-size-report-linux-arm64.json

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
        run: |
          resource_dir="$(find release -type d -path '*/resources' -print -quit)"
          test -n "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Verify packaged Linux ARM64 executable
        shell: bash
        run: |
          executable="$(find release -type f -iname 'aivplayer' -print -quit)"
          test -n "$executable"
          npm run release:check-architecture -- --architecture arm64 --file "$executable"

      - name: Verify Linux ARM64 release artifacts
        run: npm run release:check-platform -- --platform linux --architecture arm64 --artifacts-dir release --report-path release/platform-release-report-linux-arm64.json

      - name: Verify Linux ARM64 package formats
        run: npm run release:check-formats -- --platform linux --artifacts-dir release

      - name: Upload Linux ARM64 release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux-arm64
          path: |
            release/platform-release-report-linux-arm64.json
            release/package-size-report-linux-arm64.json
          if-no-files-found: ignore

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Upload Linux ARM64 Vision Pack
        uses: actions/upload-artifact@v7
        with:
          name: vision-pack-linux-arm64
          path: ${{ runner.temp }}/aivplayer-vision-pack-archive/*
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows, build-windows-arm64, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble architecture-aware release artifacts
        run: npm run release:assemble-artifacts -- --input-dir artifacts --output-dir artifacts/assembled

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Verify assembled package formats
        run: |
          npm run release:check-formats -- --platform macos --artifacts-dir artifacts/assembled
          npm run release:check-formats -- --platform windows --artifacts-dir artifacts/assembled
          npm run release:check-formats -- --platform linux --artifacts-dir artifacts/assembled

      - name: Verify merged platform evidence
        run: npm run release:check-evidence -- --artifacts-dir artifacts/assembled --report-path artifacts/assembled/merged-platform-evidence.json

      - name: Upload merged platform evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-merged
          path: artifacts/assembled/merged-platform-evidence.json
          if-no-files-found: ignore

      - name: Verify release version and update metadata
        run: npm run release:check-version -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}"

      - name: Generate release manifest
        run: npm run release:create-manifest -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}" --commit "${{ github.sha }}" --repository "${{ github.repository }}" --workflow "${{ github.workflow }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}"

      - name: Verify release manifest
        run: npm run release:check-manifest -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}"

      - name: Upload platform-specific Vision Packs to R2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --global wrangler@4.110.0
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          upload_pack() {
            local source_name="$1"
            local platform_key="$2"
            local archive="artifacts/${source_name}/vision-pack.tar.gz"
            local manifest="artifacts/${source_name}/manifest.json"
            test -f "$archive"
            test -f "$manifest"
            wrangler r2 object put "aivplayer-releases/aivplayer/vision-pack/$version/$platform_key/vision-pack.tar.gz" --remote --file "$archive" --force --cache-control 'public, max-age=31536000, immutable' --content-type 'application/gzip'
            wrangler r2 object put "aivplayer-releases/aivplayer/vision-pack/$version/$platform_key/manifest.json" --remote --file "$manifest" --force --cache-control 'public, max-age=31536000, immutable' --content-type 'application/json'
          }
          upload_pack vision-pack-macos darwin-arm64
          upload_pack vision-pack-windows-x64 win32-x64
          upload_pack vision-pack-windows-arm64 win32-arm64
          upload_pack vision-pack-linux-x64 linux-x64
          upload_pack vision-pack-linux-arm64 linux-arm64

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/assembled/*.dmg
            artifacts/assembled/*.zip
            artifacts/assembled/*.pkg
            artifacts/assembled/*.exe
            artifacts/assembled/*.AppImage
            artifacts/assembled/*.deb
            artifacts/assembled/latest*.yml
            artifacts/assembled/*.blockmap
            artifacts/assembled/release-manifest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub remote assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:verify-remote -- --platform github --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" --artifacts-dir artifacts/assembled --manifest-path artifacts/assembled/release-manifest.json --tag "${{ inputs.tag || github.ref_name }}" --report-path artifacts/assembled/github-remote-verification.json

      - name: Publish desktop downloads to R2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:publish-downloads -- --artifacts-dir artifacts/assembled --tag "${{ inputs.tag || github.ref_name }}" --repository "${{ github.repository }}"

      - name: Share GitHub remote verification report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: remote-verification-github
          path: artifacts/assembled/github-remote-verification.json
          if-no-files-found: error
