name: Sync AIVPlayer Downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to sync (e.g. v0.6.1)'
        required: true
        default: v0.6.1
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync latest two releases to R2
        run: npm run release:publish-downloads -- --tag "${{ inputs.tag }}" --repository "${{ github.repository }}" --artifacts-dir "$RUNNER_TEMP/aivplayer-no-local-artifacts"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
