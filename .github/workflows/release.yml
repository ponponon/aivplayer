          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          CXXFLAGS=-fpermissive npm run release:build-heif-source -- \
            --source-dir "$RUNNER_TEMP/libheif" \
            --build-dir "$RUNNER_TEMP/libheif-build" \
            --install-dir "$RUNNER_TEMP/libheif-install" \
            --resource-dir "$GITHUB_WORKSPACE/resources" \
            --platform linux \
            --encoder x265
          npm run release:check-heif-runtime

      - name: Build and stage ARM64 ASR/media runtime
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/whisper.cpp"
          build_dir="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "v${WHISPER_CPP_VERSION}" https://github.com/ggml-org/whisper.cpp.git "$source_dir"
          cmake -S "$source_dir" -B "$build_dir" -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" --parallel
          npm run release:prepare-runtime -- --platform linux --whisper-dir "$build_dir/bin" --ffmpeg-dir /usr/bin
          npm run release:check-runtime

      - name: Verify Linux ARM64 native binaries
        run: npm run release:check-architecture -- --architecture arm64 --file "$GITHUB_WORKSPACE/resources/whisper.cpp/whisper-cli" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffmpeg" --file "$GITHUB_WORKSPACE/resources/ffmpeg/ffprobe" --file "$GITHUB_WORKSPACE/resources/heif/heif-enc" --file "$GITHUB_WORKSPACE/resources/heif/heif-convert"

      - name: Write runtime metadata
        run: npm run release:write-runtime-metadata -- --platform linux --resource-dir "$GITHUB_WORKSPACE/resources" --whisper-version "$WHISPER_CPP_VERSION" --libheif-version "$LIBHEIF_VERSION" --libheif-encoder x265

      - name: Build & Package ARM64
        run: npm run build && npx electron-builder --linux --arm64 --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
