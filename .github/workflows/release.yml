name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

env:
  LIBHEIF_VERSION: 1.23.1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install HEIF build dependencies
        run: brew install cmake ninja pkg-config libde265 kvazaar jpeg-turbo

      - name: Build static HEIF runtime
        shell: bash
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          npm run release:build-heif-source -- \
            --source-dir "$RUNNER_TEMP/libheif" \
            --build-dir "$RUNNER_TEMP/libheif-build" \
            --install-dir "$RUNNER_TEMP/libheif-install" \
            --resource-dir "$GITHUB_WORKSPACE/resources" \
            --encoder kvazaar
          npm run release:check-heif-runtime

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
        run: |
          resource_dir="$(find release -type d -path '*/AIVPlayer.app/Contents/Resources' -print -quit)"
          test -n "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install HEIF build dependencies
        shell: pwsh
        run: vcpkg install libde265:x64-windows-static x265:x64-windows-static libjpeg-turbo:x64-windows-static

      - name: Build static HEIF runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "libheif"
          $build = Join-Path $env:RUNNER_TEMP "libheif-build"
          $install = Join-Path $env:RUNNER_TEMP "libheif-install"
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          git clone --depth 1 --branch "v$env:LIBHEIF_VERSION" https://github.com/strukturag/libheif.git $source
          npm run release:build-heif-source -- --source-dir $source --build-dir $build --install-dir $install --resource-dir "$env:GITHUB_WORKSPACE/resources" --platform win32 --toolchain-file $toolchain --vcpkg-triplet x64-windows-static --encoder x265
          npm run release:check-heif-runtime

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: pwsh
        run: |
          $resourceDir = Get-ChildItem -Path release -Directory -Recurse -Filter resources | Select-Object -First 1
          if ($null -eq $resourceDir) { throw 'Packaged resources directory was not found.' }
          npm run release:check-packaged-resources -- --resource-dir $resourceDir.FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 cmake ninja-build pkg-config libde265-dev libkvazaar-dev libjpeg-dev zlib1g-dev

      - name: Build static HEIF runtime
        shell: bash
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" https://github.com/strukturag/libheif.git "$RUNNER_TEMP/libheif"
          npm run release:build-heif-source -- \
            --source-dir "$RUNNER_TEMP/libheif" \
            --build-dir "$RUNNER_TEMP/libheif-build" \
            --install-dir "$RUNNER_TEMP/libheif-install" \
            --resource-dir "$GITHUB_WORKSPACE/resources" \
            --platform linux \
            --encoder kvazaar \
            --static-link
          npm run release:check-heif-runtime

      - name: Build & Package
        run: npm run build && npx electron-builder --publish never

      - name: Verify packaged Web and FFmpeg resources
        shell: bash
        run: |
          resource_dir="release/linux-unpacked/resources"
          test -d "$resource_dir"
          npm run release:check-packaged-resources -- --resource-dir "$resource_dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.pkg
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
